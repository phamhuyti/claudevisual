name: DualUsage

# Builds the DualUsage extension (dualusage/) on every change and, when asked,
# publishes the packaged VSIX as a GitHub Release.
#
# Release paths:
#   - Push a tag `dualusage-v<version>` (must match dualusage/package.json version).
#   - Or run this workflow manually with `release: true`; the tag is created from
#     the package.json version.
# Marketplace publish is opt-in and only runs when the VSCE_PAT secret is set.

on:
  push:
    branches: [main]
    tags: ["dualusage-v*"]
    paths:
      - "dualusage/**"
      - ".github/workflows/dualusage.yml"
  pull_request:
    branches: [main]
    paths:
      - "dualusage/**"
      - ".github/workflows/dualusage.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release (tag dualusage-v<version> from package.json)"
        type: boolean
        default: false
      publish:
        description: "Also publish to the VS Code Marketplace (needs VSCE_PAT secret)"
        type: boolean
        default: false

concurrency:
  group: dualusage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: dualusage

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      vsix: ${{ steps.meta.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dualusage/package-lock.json

      - name: Read package metadata
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=dualusage-v$version" >> "$GITHUB_OUTPUT"
          echo "vsix=dualusage-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/dualusage-v')
        run: |
          expected="${{ steps.meta.outputs.tag }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match dualusage/package.json version (expected '$expected')."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      # `npm test` runs `npm run compile` first, so dist/ is fresh for packaging.
      - run: npm test
      - run: npx vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: dualusage-vsix
          path: dualusage/*.vsix
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/dualusage-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dualusage-vsix
          path: dualusage

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: DualUsage ${{ needs.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dualusage/${{ needs.build.outputs.vsix }}

      - name: Publish to VS Code Marketplace
        if: >-
          env.VSCE_PAT != '' &&
          (startsWith(github.ref, 'refs/tags/dualusage-v') || inputs.publish)
        working-directory: .
        run: npx --yes --package @vscode/vsce vsce publish --packagePath "dualusage/${{ needs.build.outputs.vsix }}"
