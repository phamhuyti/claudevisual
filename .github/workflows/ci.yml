name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run compile
      - run: npm test
      - run: npx vsce package

      # Publish the packaged extension so a build can be installed without a
      # local Node toolchain (download the artifact, `code --install-extension`).
      - uses: actions/upload-artifact@v7
        with:
          name: claudevisual-vsix
          path: "*.vsix"
          if-no-files-found: error
